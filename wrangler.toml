# Glisk — Worker serving the static site plus the booking API.
#
#   npx wrangler deploy
#
# Static files are served straight from the asset store; only /api/* reaches
# the Worker. The site itself is still plain HTML with no build step.
#
# Before the first deploy, create the database and put its id below:
#
#   npx wrangler d1 create glisk-bookings
#   npx wrangler d1 execute glisk-bookings --remote --file=worker/schema.sql
#   npx wrangler d1 execute glisk-bookings --remote --file=worker/seed.sql
#
# Then the secrets:
#
#   npx wrangler secret put ADMIN_TOKEN            # any long random string
#   npx wrangler secret put RESEND_API_KEY         # optional, for confirmation emails
#   npx wrangler secret put STRIPE_SECRET_KEY      # when you are ready to take money
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET  # from the Stripe webhook you create
#
# Until STRIPE_SECRET_KEY is set the site runs the same flow with a simulated
# checkout: payments are recorded as 'simulated', never as 'paid', and the
# simulate endpoint disappears the moment a real key is present.
#
# See worker/README.md for the whole run-through.

name = "glisk-preview"
main = "worker/index.js"
compatibility_date = "2026-01-01"

[assets]
directory = "./"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "glisk-bookings"
database_id = "PUT-THE-DATABASE-ID-HERE"

[vars]
MAIL_FROM = "Glisk <hello@gliskmassage.co.uk>"
OWNER_EMAIL = "hello@gliskmassage.co.uk"
