<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 232" role="img" aria-label="Glisk — Massage &amp; Yoga">
  <title>Glisk — Massage &amp; Yoga</title>
  <!--
    STAND-IN, awaiting the supplied artwork.
    The sun mark and the colours are matched to the real logo; the GLISK
    lettering is a serif stack, not the real lettering, which needs the original
    file. Replace this whole file — the nav and footer on every page point here.
  -->
  <defs>
    <!-- one ray: a teardrop, tapering to a point at the base -->
    <path id="ray" d="M0 0 C7.5 -19 10 -30 0 -44 C-10 -30 -7.5 -19 0 0 Z"/>
  </defs>

  <g fill="#BF8129">
    <g transform="translate(240 106)">
      <use href="#ray" transform="translate(0 -46)"/>
      <use href="#ray" transform="rotate(26) translate(0 -46)"/>
      <use href="#ray" transform="rotate(-26) translate(0 -46)"/>
      <use href="#ray" transform="rotate(52) translate(0 -42) scale(.88)"/>
      <use href="#ray" transform="rotate(-52) translate(0 -42) scale(.88)"/>
    </g>
    <!-- the sun: a half disc sitting on the baseline of the wordmark -->
    <path d="M184 152 a56 56 0 0 1 112 0 Z"/>
  </g>

  <text x="240" y="152" text-anchor="middle" fill="#2B2119"
        font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif"
        font-size="116" font-weight="700" letter-spacing="1">GLISK</text>

  <g fill="#BF8129">
    <rect x="26" y="198" width="92" height="5" rx="2.5"/>
    <rect x="362" y="198" width="92" height="5" rx="2.5"/>
    <text x="240" y="210" text-anchor="middle"
          font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif"
          font-size="27" font-weight="700" letter-spacing="6.5">MASSAGE &amp; YOGA</text>
  </g>
</svg>
