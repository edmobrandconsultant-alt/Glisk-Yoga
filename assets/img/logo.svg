<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 232" role="img" aria-label="Glisk — Massage &amp; Yoga">
  <title>Glisk — Massage &amp; Yoga</title>
  <!--
    STAND-IN. The sun mark is reproduced faithfully; the GLISK wordmark is set in
    a serif stack rather than the real lettering, which needs the original file.
    Replace this whole file with the supplied artwork — nothing else needs to
    change, the nav and footer both point here.
  -->
  <g fill="#C0842B">
    <!-- five rays, radiating from the centre of the sun at (240,150) -->
    <ellipse cx="240" cy="64" rx="7.5" ry="25"/>
    <ellipse cx="240" cy="64" rx="7" ry="23" transform="rotate(25 240 150)"/>
    <ellipse cx="240" cy="64" rx="7" ry="23" transform="rotate(-25 240 150)"/>
    <ellipse cx="240" cy="70" rx="6.5" ry="20" transform="rotate(50 240 150)"/>
    <ellipse cx="240" cy="70" rx="6.5" ry="20" transform="rotate(-50 240 150)"/>
    <!-- the sun itself: a half disc sitting on the baseline of the wordmark -->
    <path d="M182 150 a58 58 0 0 1 116 0 Z"/>
  </g>

  <text x="240" y="150" text-anchor="middle" fill="#231F1C"
        font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif"
        font-size="112" font-weight="600" letter-spacing="2">GLISK</text>

  <g fill="#C0842B">
    <rect x="30" y="196" width="86" height="4" rx="2"/>
    <rect x="364" y="196" width="86" height="4" rx="2"/>
    <text x="240" y="207" text-anchor="middle"
          font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif"
          font-size="28" font-weight="600" letter-spacing="6">MASSAGE &amp; YOGA</text>
  </g>
</svg>
